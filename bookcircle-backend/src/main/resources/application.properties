spring.application.name=bookcircle
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Load local .env values when present
spring.config.import=optional:dotenv:./.env

# Database configuration (overridden by .env if provided)
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookcircle}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Create / update table schema automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Google Maps Geocoding API. Put the real key in .env as GOOGLE_MAPS_API_KEY.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.geocoding-url=https://maps.googleapis.com/maps/api/geocode/json
google.maps.region=${GOOGLE_MAPS_REGION:in}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#to bypass security 
#spring.security.user.name = admin
#spring.security.user.password = admin

# DevTools configuration for hot reload
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2000
spring.devtools.restart.quiet-period=1000
spring.devtools.livereload.enabled=true

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=70MB

# ================== Gemini AI Configuration ==================
gemini.api-key=${GEMINI_API_KEY:}
gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

# ================== Redis Caching ==================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=43200000
