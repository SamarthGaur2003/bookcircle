<!DOCTYPE html>
<html>
<head>
    <title>Chat Test</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        #chat {
            border: 1px solid #ccc;
            height: 300px;
            width: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-top: 10px;
        }

        .msg {
            margin: 5px 0;
            padding: 5px;
            border-radius: 5px;
        }

        .sent {
            background-color: #d1e7dd;
            text-align: right;
        }

        .received {
            background-color: #f8d7da;
            text-align: left;
        }
    </style>
</head>

<body>

<h2>Secure Chat Test</h2>

<input id="sender" placeholder="Sender ID" />
<input id="receiver" placeholder="Receiver ID" />
<input id="message" placeholder="Message" />

<br><br>

<button onclick="connect()">Connect</button>
<button onclick="sendMessage()">Send</button>

<div id="chat"></div>

<script>
    let stompClient = null;

    function connect() {
        const socket = new SockJS('http://localhost:8080/chat');
        stompClient = Stomp.over(socket);

        const token = prompt("Enter JWT Token");

        stompClient.connect({
            Authorization: "Bearer " + token   // ✅ FIXED (space added)
        }, function () {
            alert("Connected");

            subscribe(); // ✅ AUTO SUBSCRIBE
        });
    }

    function subscribe() {

        stompClient.subscribe('/user/queue/messages', function (msg) {

            console.log("RAW:", msg.body);

            const data = JSON.parse(msg.body);

            const senderId = document.getElementById("sender").value;

            const div = document.createElement("div");
            div.classList.add("msg");

            if (data.sender.id == senderId) {
                div.classList.add("sent");
            } else {
                div.classList.add("received");
            }

            div.innerText = data.content;

            document.getElementById("chat").appendChild(div);

            // auto scroll
            document.getElementById("chat").scrollTop =
                document.getElementById("chat").scrollHeight;
        });

        console.log("Subscribed to private channel");
    }

    function sendMessage() {
        const sender = document.getElementById("sender").value;
        const receiver = document.getElementById("receiver").value;
        const message = document.getElementById("message").value;

        stompClient.send("/app/send", {}, JSON.stringify({
            senderId: parseInt(sender),
            receiverId: parseInt(receiver),
            content: message
        }));
    }
</script>

</body>
</html>
